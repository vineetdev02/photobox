name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    # A React library is consumed through its exports map, not its source, so
    # the entry points are checked the way a consumer resolves them: publint
    # for the package manifest, attw for the type declarations under both the
    # import and the require condition.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes publint@latest
      # styles.css is a stylesheet with no declarations to resolve, and attw
      # reports that as a failure, so the CSS entry point is excluded rather
      # than the check being dropped.
      - run: npx --yes @arethetypeswrong/cli@latest --pack --exclude-entrypoints styles.css

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
